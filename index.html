function updateBiomeMusic() {
    const tile = getTileAt(player.x, player.y);
    const inOcean = (
        tile === WATER &&
        player.x > MAP_W * TILE * 0.65
    );

    if (tile === SHADOWLAND) {
        if (seaMusic && !seaMusic.paused) seaMusic.pause();
        if (bgMusic && !bgMusic.paused) bgMusic.pause();

        if (darkMusic.paused) {
            darkMusic.play().catch(()=>{});
        }
    }
    else if (inOcean) {
        if (darkMusic && !darkMusic.paused) darkMusic.pause();
        if (bgMusic && !bgMusic.paused) bgMusic.pause();

        if (seaMusic.paused) {
            seaMusic.play().catch(()=>{});
        }
    }
    else {
        if (darkMusic && !darkMusic.paused) darkMusic.pause();
        if (seaMusic && !seaMusic.paused) seaMusic.pause();

        if (bgMusic.paused) {
            bgMusic.play().catch(()=>{});
        }
    }
}

const world = [];

for(let y=0;y<MAP_H;y++) {

    world[y] = [];

    for(let x=0;x<MAP_W;x++) {

        let tile;
        const shadowRadius = 150;

        const dxShadow = x;
        const dyShadow = (MAP_H - 1) - y;

        const inShadowBiome = Math.hypot(dxShadow, dyShadow) < shadowRadius;
        const shadowEdgeRiver =
        Math.abs(
        Math.hypot(dxShadow, dyShadow)
        - shadowRadius
        ) < 3;
        if(inShadowBiome) {

        tile = SHADOWLAND;
        }
        else {
        // existing coastline generation code
        

        // unified coastline
        const oceanEdge = Math.floor(MAP_W * 0.65);

        const river0 =
        Math.sin(y * 0.04) * 12 +
        Math.sin(y * 0.011) * 7 +
        MAP_W * 0.10;

        // unified river equations
        const river1 =
            Math.sin(y * 0.05) * 10 +
            Math.sin(y * 0.013) * 6 +
            MAP_W * 0.22;

        const centerPull =
        Math.sin((y / MAP_H) * Math.PI) * 28;

        const river2 =
        Math.sin(y * 0.03) * 8 +
        Math.sin(y * 0.02) * 5 +
        MAP_W * 0.45 -
        centerPull;

        const river3 =
            Math.sin(y * 0.08) * 6 +
            MAP_W * 0.58;

        // giant east ocean
        if(x > oceanEdge) {

            tile = WATER;

        }
        // rivers
        else if(
            shadowEdgeRiver ||
            Math.abs(x - river0) < 3 ||   // wider left river
            Math.abs(x - river1) < 2 ||
            Math.abs(x - river2) < 2 ||
            Math.abs(x - river3) < 2
            ) {
            tile = WATER;

        }
        else {

            // beach strip
            if(
                x >= oceanEdge - 4 &&
                x <= oceanEdge
            ) {

                tile = SAND;

            } else {

                tile = LAND;

                const r = Math.random();

                if(r < 0.04)
                    tile = ROCK;
                else if(r < 0.12)
                    tile = GRASS;
            }
        }

        
    }
    world[y][x] = tile;
    }
}

const filters = [];
// place filters ONLY on land touching water
for(let y=1;y<MAP_H-1;y++) {
    for(let x=1;x<MAP_W-1;x++) {
        if(
            x >= building.x &&
            x < building.x + building.w &&
            y >= building.y &&
            y < building.y + building.h
        ) {
            continue;
        }

        // only on mainland near ocean edge
        if(world[y][x] !== LAND &&
        world[y][x] !== SHADOWLAND)
            continue;

        // random sparse placement
        if(Math.random() > 0.007)
            continue;

        let touchingWater = false;
        let touchingOcean = false;

        for(let oy=-1;oy<=1;oy++) {
            for(let ox=-1;ox<=1;ox++) {

                if(world[y+oy][x+ox] === WATER) {

                    touchingWater = true;

                    // ONLY right-side ocean

                        touchingOcean = true;
                }

        if(touchingWater && !touchingOcean) {

            filters.push({
                x: x * TILE + TILE/2,
                y: y * TILE + TILE/2
            });

    }

                // prevent scenery spawning inside building

function getTileAt(px, py) {

    const tx = Math.floor(px / TILE);
    const ty = Math.floor(py / TILE);

    if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H)
        return LAND;

    return world[ty][tx];
}

function playerInSanctuary() {
    return getTileAt(player.x, player.y) === SANCTUARY_FLOOR;
}

const OCEAN_SANCTUARY = {
    cx: Math.floor(MAP_W * 0.825), // dead center of ocean biome
    cy: Math.floor(MAP_H * 0.5),
    radius: 3 // diameter 7 tiles
};

function makeOceanSanctuary() {

    const cx = OCEAN_SANCTUARY.cx;
    const cy = OCEAN_SANCTUARY.cy;
    const r = OCEAN_SANCTUARY.radius;

    for(let y = cy - r - 1; y <= cy + r + 1; y++) {
        for(let x = cx - r - 1; x <= cx + r + 1; x++) {

            if(
                x < 0 || y < 0 ||
                x >= MAP_W || y >= MAP_H
            ) continue;

            const dist = Math.hypot(x - cx, y - cy);

            if(dist <= r) {
                world[y][x] = SANCTUARY_FLOOR;
            }
            else if(dist <= r + 1) {
                world[y][x] = SANCTUARY_WALL;
            }
        }
    }

    // four 1-tile entrances

    world[cy - r - 1][cx] = SANCTUARY_FLOOR;
    world[cy + r + 1][cx] = SANCTUARY_FLOOR;
    world[cy][cx - r - 1] = SANCTUARY_FLOOR;
    world[cy][cx + r + 1] = SANCTUARY_FLOOR;
    }

makeOceanSanctuary();

function makeBuilding() {

    const bx = building.x;
    const by = building.y;
    const bw = building.w;
    const bh = building.h;

    // floor
    for(let y=by; y<by+bh; y++) {
        for(let x=bx; x<bx+bw; x++) {

            world[y][x] = FLOOR;
        }
    }

    // outer walls
    for(let x=bx; x<bx+bw; x++) {

        world[by][x] = WALL;
        world[by+bh-1][x] = WALL;
    }

    for(let y=by; y<by+bh; y++) {

        world[y][bx] = WALL;
        world[y][bx+bw-1] = WALL;
    }

    // top entrance
    world[by][bx + Math.floor(bw/2)] = FLOOR;
    world[by][bx + Math.floor(bw/2)-1] = FLOOR;

    // bottom entrance
    world[by+bh-1][bx + Math.floor(bw/2)] = FLOOR;
    world[by+bh-1][bx + Math.floor(bw/2)-1] = FLOOR;

    // left room wall — full interior height, with a doorway gap
    for(let y=by+1; y<by+bh-1; y++) {
        if(y === by+Math.floor(bh/2) || y === by+Math.floor(bh/2)-1) continue; // doorway
        world[y][bx+8] = WALL;
    }

    // right room wall — full interior height, with a doorway gap
    for(let y=by+1; y<by+bh-1; y++) {
        if(y === by+Math.floor(bh/2) || y === by+Math.floor(bh/2)-1) continue; // doorway
        world[y][bx+bw-9] = WALL;
    }

    // central box — drawn last so nothing overwrites it
    for(let x=bx+11; x<bx+15; x++) {
        world[by+7][x] = WALL;
        world[by+11][x] = WALL;
    }

    for(let y=by+7; y<=by+11; y++) {
        world[y][bx+11] = WALL;
        world[y][bx+14] = WALL;
    }

    // open one side of the central box as a doorway
    world[by+11][bx+12] = FLOOR;
    world[by+11][bx+13] = FLOOR;
}

function updatePlayer() {
    if(isDead) return;
    let speed = player.speed;
    if(getTileAt(player.x, player.y) === SHADOWLAND) {
    speed *= 0.75;
    }

    if(getTileAt(player.x, player.y) === WATER) {

    let swimMultiplier = 0.33;

    if(flippersCollected)
        swimMultiplier *= 1.25;

    speed *= swimMultiplier;
    }

    for(const k of cumberkelps) {
        const kTileX = Math.floor(k.x / TILE);
        const kTileY = Math.floor(k.y / TILE);

        const pTileX = Math.floor(player.x / TILE);
        const pTileY = Math.floor(player.y / TILE);

        if(
            Math.abs(pTileX - kTileX) <= 1 &&
            Math.abs(pTileY - kTileY) <= 1
        ) {
            speed *= 0.33;
            break;
        }
    }

    const prevX = player.x;
    const prevY = player.y;

    if(keys["w"]) {
    player.y -= speed;
    playerFacing = "back";
    }

    if(keys["s"]) {
    player.y += speed;
    playerFacing = "front";
    }

    if(keys["a"]) player.x -= speed;
    if(keys["d"]) player.x += speed;

    // Sliding collision: test each axis independently
    const tileXY = getTileAt(player.x, player.y);
    const hitXY = tileXY === WALL || isInsideBigBowlder(player.x, player.y);

    if(hitXY) {
        // Try keeping only the X movement
        const tileXonly = getTileAt(player.x, prevY);
        const hitXonly = tileXonly === WALL || isInsideBigBowlder(player.x, prevY);

        // Try keeping only the Y movement
        const tileYonly = getTileAt(prevX, player.y);
        const hitYonly = tileYonly === WALL || isInsideBigBowlder(prevX, player.y);

        if(!hitXonly) {
            // X is fine, block Y
            player.y = prevY;
        } else if(!hitYonly) {
            // Y is fine, block X
            player.x = prevX;
        } else {
            // Both axes blocked — full stop
            player.x = prevX;
            player.y = prevY;
        }
    }

    player.x = Math.max(
    player.size,
    Math.min(player.x, MAP_W * TILE - player.size)
    );

    player.y = Math.max(
    player.size,
    Math.min(player.y, MAP_H * TILE - player.size)
    );
}



function updateEnemies() {

    for(const c of coastlings) {

        let dx = player.x - c.x;
        let dy = player.y - c.y;

        let dist = Math.hypot(dx, dy);

        if(dist > 0 && dist < 500) {

            let nextX = c.x + dx / dist * c.speed;
            let nextY = c.y + dy / dist * c.speed;

            if(
            getTileAt(nextX, nextY) !== WALL &&
            !isInsideBigBowlder(nextX, nextY)
            ) {

            c.x = nextX;
            c.y = nextY;
            if(dx<-5)
                c.facing=-1;
            else if(dx>5)
                c.facing=1;
            }
        }

        if(c.damageCooldown > 0)
            c.damageCooldown--;

        if(dist < 30 && c.damageCooldown <= 0) {

            player.hp -= 20;
            takeDamageSound.currentTime = 0;
            takeDamageSound.play();

            c.damageCooldown = 60;

            if(player.hp <= 0){
                player.hp = 0;
                finalScore = survivalScore;
                isDead = true;
            }
        }
    }

    for(const a of adultCoastlings) {

        let dx = player.x - a.x;
        let dy = player.y - a.y;

        let dist = Math.hypot(dx, dy);
        a.aggroed = dist < 700;

        if(dist>0 && dist < 700) {

            let nextX = a.x + dx / dist * a.speed;
            let nextY = a.y + dy / dist * a.speed;

            if(getTileAt(nextX, nextY) !== WALL) {

            a.x = nextX;
            a.y = nextY;
            if(dx<-5)
                a.facing=-1;
            else if(dx>5)
                a.facing=1;
            }
        }

        if(a.damageCooldown > 0)
            a.damageCooldown--;

        if(dist < 55 && a.damageCooldown <= 0) {

            player.hp -= 50;
            takeDamageSound.currentTime = 0;
            takeDamageSound.play();

            a.damageCooldown = 90;

            if(player.hp <= 0) {

                player.hp = 0;
                finalScore = survivalScore;
                isDead = true;
            }
        }
    }
}

function updateCrabs() {

    for(const c of crabs) {

        if(c.collected)
            continue;

        // circular motion
        c.angle += c.speed;

        c.x =
            c.centerX +
            Math.cos(c.angle) * c.radius;

        c.y =
            c.centerY +
            Math.sin(c.angle) * c.radius;

        let dx = player.x - c.x;
        let dy = player.y - c.y;

        let dist = Math.hypot(dx, dy);

        // pickup
        if(dist < 38) {

            // increase max hp
            player.maxHp += 10;

            // fully heal bonus hp too
            player.hp += 10;

            if(player.hp > player.maxHp)
                player.hp = player.maxHp;

            c.collected = true;
        }
    }
}

function updateVoomer() {

    // ONLY active in ocean
    if(player.x < MAP_W * TILE * 0.65)
        return;

    // flip sprite every second
    voomer.flipTimer++;

    if(voomer.flipTimer >= 60) {

        voomer.flipTimer = 0;

        if(voomer.currentSprite === voomerLeftImg)
            voomer.currentSprite = voomerRightImg;
        else
            voomer.currentSprite = voomerLeftImg;
    }

    let dx = player.x - voomer.x;
    let dy = player.y - voomer.y;

    let dist = Math.hypot(dx, dy);

    // huge aggro range in ocean
    if(dist < 1400) {

        let moveX = dx / dist * voomer.speed;
        let moveY = dy / dist * voomer.speed;

        let nextX = voomer.x + moveX;
        let nextY = voomer.y + moveY;

        // cannot leave right ocean
        if(
            getTileAt(nextX, nextY) === WATER &&
            nextX > MAP_W * TILE * 0.65
        ) {

            voomer.x = nextX;
            voomer.y = nextY;
        }

        if(dx < -5)
            voomer.facing = -1;
        else if(dx > 5)
            voomer.facing = 1;
    }

    if(voomer.damageCooldown > 0)
        voomer.damageCooldown--;

    // massive contact hit
    const dxHit = player.x - voomer.x;
    const dyHit = player.y - voomer.y;

    const hitboxX = 240; // wide
    const hitboxY = 120;  // shorter vertically

    const insideHitbox =
    (dxHit * dxHit) / (hitboxX * hitboxX) +
    (dyHit * dyHit) / (hitboxY * hitboxY)
    <= 1;

    if(insideHitbox && voomer.damageCooldown <= 0) {

        player.hp -= 200;

        takeDamageSound.currentTime = 0;
        takeDamageSound.play();

        voomer.damageCooldown = 90;

        if(player.hp <= 0) {

            finalScore = survivalScore;

            isDead = true;
        }
    }
}

function updateViperheads() {

    for(const v of viperheads) {

        let dx = player.x - v.x;
        let dy = player.y - v.y;

        let dist = Math.hypot(dx, dy);

        const stopDistance = TILE * 2;

        // same left/right flip logic as coastlings
        if(dx < -5)
            v.facing = -1;
        else if(dx > 5)
            v.facing = 1;

        if(v.attackCooldown > 0)
            v.attackCooldown--;

        // pursue until within 2 tiles
        const aggroRange = 800; 
        if(dist < aggroRange)
        v.aggroed = true;

        if(
        v.aggroed &&
        dist < aggroRange &&
        dist > stopDistance
        ) {

        const moveX = dx / dist * v.speed;
        const moveY = dy / dist * v.speed;

        const nextX = v.x + moveX;
        const nextY = v.y + moveY;

        v.x = nextX;
        v.y = nextY;
        
        }
        else if(
        v.aggroed &&
        dist <= stopDistance &&
        v.attackCooldown <= 0
        ) {


        const centerTileX =
            Math.floor(v.x / TILE);

        const centerTileY =
            Math.floor(v.y / TILE);

        // visual warning area
        for(let oy = -5; oy <= 5; oy++) {
            for(let ox = -5; ox <= 5; ox++) {

                if(Math.hypot(ox, oy) <= 5) {

                    viperAttackEffects.push({
                        x: (centerTileX + ox) * TILE + TILE/2,
                        y: (centerTileY + oy) * TILE + TILE/2,
                        timer: 60
                    });
                }
            }
        }

        // actual damage radius
        const attackRadius = TILE * 5;

        if(
            Math.hypot(
                player.x - v.x,
                player.y - v.y
                ) <= attackRadius
        ) {

            player.hp -= 35;

            takeDamageSound.currentTime = 0;
            takeDamageSound.play();

            if(player.hp <= 0) {

                player.hp = 0;
                finalScore = survivalScore;
                isDead = true;
            }
        }

        v.attackCooldown = 60;
        }
    }

    for(let i = viperAttackEffects.length - 1; i >= 0; i--) {

        viperAttackEffects[i].timer--;

        if(viperAttackEffects[i].timer <= 0)
            viperAttackEffects.splice(i, 1);
    }
}

let lastWaterX = jetski.x;
let lastWaterY = jetski.y;

function updateJetski() {

    const dx = player.x - jetski.x;
    const dy = player.y - jetski.y;

    const dist = Math.hypot(dx, dy);

    // MOUNT
    if(
        !ridingJetski &&
        dist < 55 &&
        getTileAt(jetski.x, jetski.y) === WATER
    ) {

        ridingJetski = true;

        player.speed = 9;

        playerFacing = "back";

        jetski.mounted = true;
        jetski.parked = false;
    }

    if(!ridingJetski)
        return;

    // remember last water position
    if(
        getTileAt(player.x, player.y) === WATER
    ) {
        lastWaterX = player.x;
        lastWaterY = player.y;
    }

    // jetski follows player
    jetski.x = player.x;
    jetski.y = player.y;

    const tile = getTileAt(
        player.x,
        player.y
    );

    const mustDismount =

        tile === LAND ||
        tile === GRASS ||
        tile === ROCK ||
        tile === SAND ||
        tile === FLOOR ||
        tile === WALL ||
        tile === SHADOWLAND ||
        tile === SANCTUARY_FLOOR ||
        tile === SANCTUARY_WALL;

    if(mustDismount) {

        ridingJetski = false;

        jetski.mounted = false;
        jetski.parked = true;

        // leave jetski at last water tile
        jetski.x = lastWaterX;
        jetski.y = lastWaterY;

        // restore walking speed
        player.speed =
            waterBootsCollected
            ? 3.25
            : 2.6;

        // return to normal player
        playerFacing = "front";

        // move player onto land
        const push = 50;

        if(keys["w"]) player.y -= push;
        if(keys["s"]) player.y += push;
        if(keys["a"]) player.x -= push;
        if(keys["d"]) player.x += push;
    }
}

function drawWorld() {

    const camX = player.x - canvas.width/2;
    const camY = player.y - canvas.height/2;

    const startX = Math.floor(camX / TILE);
    const startY = Math.floor(camY / TILE);

    const endX = startX + Math.ceil(canvas.width/TILE)+2;
    const endY = startY + Math.ceil(canvas.height/TILE)+2;

    for(let y=startY;y<endY;y++) {
        for(let x=startX;x<endX;x++) {

            if(x<0 || y<0 || x>=MAP_W || y>=MAP_H)
                continue;

            let tile = world[y][x];

            let sx = x*TILE - camX;
            let sy = y*TILE - camY;

            // LAND
            if(tile === LAND) {

                ctx.fillStyle = "#7a5c2e";
                ctx.fillRect(sx, sy, TILE, TILE);

                ctx.fillStyle = "rgba(0,0,0,0.08)";
                ctx.fillRect(sx, sy, TILE, TILE);

                for(let i=0;i<10;i++) {

                    const seed = x * 831 + y * 1921 + i * 77;

                    const px = (seed * 13) % TILE;
                    const py = (seed * 29) % TILE;

                    ctx.fillStyle =
                        i % 2 === 0
                        ? "rgba(0,0,0,0.06)"
                        : "rgba(255,255,255,0.012)";

                    ctx.fillRect(
                        sx + px,
                        sy + py,
                        4,
                        4
                    );
                }
            }

            // WATER
            else if(tile === WATER) {

                // ocean starts here
            const oceanStart = MAP_W * 0.65;

            let oceanDepth = 0;

            // ONLY darken the giant right ocean
            if(x > oceanStart) {

            oceanDepth =
            (x - oceanStart) /
            (MAP_W - oceanStart);

            // stronger contrast curve
            oceanDepth =
            Math.pow(oceanDepth, 1.8);
            }

            // much stronger darkening
            const r = Math.floor(32 - oceanDepth * 28);
            const g = Math.floor(73 - oceanDepth * 58);
            const b = Math.floor(106 - oceanDepth * 76);

            ctx.fillStyle = `rgb(${r},${g},${b})`;

            ctx.fillRect(sx, sy, TILE, TILE);

            if(
            x > oceanStart &&
            world[y][x - 1] !== WATER
            ) {

            const wave =
            Math.sin(y * 0.35) * 6 +
            Math.sin(y * 0.12) * 3;

            ctx.fillStyle = "rgba(255,255,255,0.85)";

            ctx.beginPath();

            ctx.moveTo(sx, sy);

            ctx.lineTo(
            sx + 8 + wave,
            sy
            );

            ctx.lineTo(
            sx + 14 + wave,
            sy + TILE * 0.25
            );

            ctx.lineTo(
            sx + 8 + wave,
            sy + TILE * 0.5
            );

            ctx.lineTo(
            sx + 14 + wave,
            sy + TILE * 0.75
            );

            ctx.lineTo(
            sx + 8 + wave,
            sy + TILE
            );

            ctx.lineTo(
            sx,
            sy + TILE
            );

            ctx.closePath();

            ctx.fill();
            }

            // water sparkle details
            ctx.fillStyle = "rgba(255,255,255,0.22)";

            for(let i=0;i<3;i++) {

            const seed =
            (x * 928371 + y * 12377 + i * 19283);

            const px =
            ((seed * 16807) % TILE);

            const py =
            ((seed * 48271) % TILE);

            ctx.fillRect(
            sx + px,
            sy + py,
            8,
            2
            );
            }
            }

            else if(tile === SAND) {

            ctx.fillStyle = "#c2a56c";

            ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
            );

            ctx.fillStyle = "rgba(255,255,255,0.05)";

            for(let i=0;i<6;i++) {

            const seed =
            x * 7123 +
            y * 9127 +
            i * 199;

            const px =
            (seed * 37) % TILE;

            const py =
            (seed * 17) % TILE;

            ctx.fillRect(
            sx + px,
            sy + py,
            2,
            2
            );
            }

            }

            // WALL
            else if(tile === WALL) {

            ctx.fillStyle = "#3a3a3a";

            ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
            );

            ctx.fillStyle = "rgba(255,255,255,0.08)";

            ctx.fillRect(
            sx,
            sy,
            TILE,
            4
            );
            }

            //SANCTUARY WALL
            else if(tile === SANCTUARY_WALL) {

            ctx.fillStyle = "#8c4522"; // rusty dark orange/red

            ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
            );

            ctx.fillStyle = "rgba(255,255,255,0.08)";

            ctx.fillRect(
            sx,
            sy,
            TILE,
            4
            );
            }

            // FLOOR
            else if(tile === FLOOR) {

            ctx.fillStyle = "#9a9a9a";

            ctx.fillRect(
                sx,
                sy,
                TILE,
                TILE
            );

            ctx.strokeStyle = "rgba(0,0,0,0.08)";

            ctx.strokeRect(
            sx,
            sy,
            TILE,
            TILE
            );
            }

            //SANCTUARY FLOOR
            else if(tile === SANCTUARY_FLOOR) {

            ctx.fillStyle = "#c89a63"; // light brown

            ctx.fillRect(
            sx,
            sy,
            TILE,
            TILE
            );

            ctx.strokeStyle = "rgba(0,0,0,0.10)";
            ctx.strokeRect(
            sx,
            sy,
            TILE,
            TILE
            );
            }

            // ROCKS
            else if(tile === ROCK) {

                ctx.fillStyle = "#7a5c2e";
                ctx.fillRect(sx, sy, TILE, TILE);

                ctx.fillStyle = "#333";

                for(let i=0;i<5;i++) {
                    const seed = x * 991 + y * 313 + i * 97;
                    const rx = 8 + ((seed * 17) % 24);
                    const ry = 8 + ((seed * 31) % 24);
                    const rr = 4 + ((seed * 13) % 5);

                    ctx.beginPath();

                    ctx.arc(
                        sx + rx,
                        sy + ry,
                        rr,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();
                }
            }

            // GRASS
            else if(tile === GRASS) {

                ctx.fillStyle = "#7a5c2e";
                ctx.fillRect(sx, sy, TILE, TILE);

                ctx.strokeStyle = "#7f6a28";

                for(let i=0;i<7;i++) {
                    const seed = x * 7123 + y * 9127 + i * 199;
                    const gx = 4 + ((seed * 37) % 30);
                    const gh = 12 + ((seed * 17) % 10);

                    ctx.beginPath();

                    ctx.moveTo(
                        sx + gx,
                        sy + 34
                    );

                    ctx.lineTo(
                        sx + gx - 2,
                        sy + 34 - gh
                    );

                    ctx.stroke();
                }
            }
            else if(tile === SHADOWLAND) {

            ctx.fillStyle = "#2b1d12";
            ctx.fillRect(sx, sy, TILE, TILE);

            ctx.fillStyle = "rgba(200,120,255,0.12)";
            ctx.fillRect(sx, sy, TILE, TILE);


            for(let i=0;i<10;i++) {

            const seed = x * 719 + y * 1297 + i * 53;

            const px = (seed * 17) % TILE;
            const py = (seed * 31) % TILE;

            ctx.fillStyle =
            i % 2
            ? "rgba(90,55,25,0.45)"
            : "rgba(45,25,10,0.35)";
            ctx.fillRect(
            sx + px,
            sy + py,
            4,
            4
            );
            }
            }
        }
    }
}

function isInsideBigBowlder(px, py) {

    for(const b of bigBowlders) {

        const left = b.x - TILE;
        const right = b.x + TILE;

        const top = b.y - TILE * 1.5;
        const bottom = b.y + TILE * 1.5;

        if(
            px > left &&
            px < right &&
            py > top &&
            py < bottom
        ) {
            return true;
        }
    }

    return false;
}

function nearBigBowlder(x, y) {

    for(const b of bigBowlders) {

        if(
            Math.hypot(x - b.x, y - b.y) < 100
        ) {
            return true;
        }
    }

    return false;
}

function drawCircleBar(x, y, radius, value, color, icon) {

    ctx.lineWidth = 10;

    // background
    ctx.strokeStyle = "#333";

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();

    // value arc
    ctx.strokeStyle = color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        -Math.PI / 2,
        (-Math.PI / 2) + (Math.PI * 2) * (value / 100)
    );

    ctx.stroke();

    // icon
    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.textAlign = "center";

    ctx.fillText(icon, x, y + 8);

    ctx.textAlign = "left";

    // food/water numbers only
    if(icon !== "♥") {

        ctx.fillStyle = "white";
        ctx.font = "28px Arial";

        ctx.fillText(
            Math.floor(value),
            x + 45,
            y + 10
        );
    }
}

function movePlayerToSafeSpot() {

    // if stuck inside a big bowlder,
    // move player 2 tiles to the right
    if(isInsideBigBowlder(player.x, player.y)) {

        player.x += TILE * 2;
    }
}

function respawnPlayer() {

    player.x = (80 + 80) * TILE;
    player.y = (80 + 80) * TILE;

    // safety correction
    movePlayerToSafeSpot();

    // respawn with upgraded max hp
    player.hp = player.maxHp;

    player.food = 50;
    player.water = 50;

    survivalScore = 0;

    isDead = false;
}

}

document.getElementById("playBtn").onclick = ()=>{
    bgMusic.play();
    document.getElementById("menu").style.display = "none";

    canvas.style.display = "block";

    gameLoop();
};

document.getElementById("quitBtn").onclick = ()=>{

    window.close();

    document.body.innerHTML = `
    <div style="
        background:black;
        color:white;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:50px;
    ">
        Coast Keeper Closed
    </div>
    `;
};

</script>
</body>
</html>
